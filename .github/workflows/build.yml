
name: Build Subcake APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository contents:"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Upload the Subcake project ZIP to the root of your repository."
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

      - name: Verify Android project
        run: |
          PROJECT_DIR="source/SubcakeReborn"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project folder not found."
            echo "Expected: $PROJECT_DIR"
            find source -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle build file not found."
            exit 1
          fi

          echo "Android project verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle -p source/SubcakeReborn \
            --no-daemon \
            :app:assembleDebug

      - name: Check APK exists
        run: |
          APK="source/SubcakeReborn/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubcakeReborn-APK
          path: source/SubcakeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
